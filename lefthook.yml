pre-commit:
  jobs:
    - name: biome
      glob: "*.{ts,tsx,js,json,jsonc}"
      run: bunx --no-install biome check --write --files-ignore-unknown=true --no-errors-on-unmatched {staged_files}
      stage_fixed: true
commit-msg:
  jobs:
    - name: conventional-commit
      run: bash scripts/commit-msg.sh {1}
pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: bun run typecheck
    - name: tests
      run: bun run test
    - name: lint
      run: bun run lint
